services:
  postgres:
    image: postgres:16
    container_name: quiniela_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: quiniela
      POSTGRES_PASSWORD: quiniela
      POSTGRES_DB: quiniela
    volumes:
      - quiniela_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiniela -d quiniela"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: quiniela_api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      PORT: 6371
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /backend
    container_name: quiniela_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /backend
    depends_on:
      api:
        condition: service_started
    ports:
      - "6371:8371"

volumes:
  quiniela_pg_data:
